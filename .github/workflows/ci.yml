name: smoke
on: [push, workflow_dispatch]
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: docker compose build
      - run: COMPOSE="docker compose" uv run python scripts/run_experiment.py configs/smoke.yaml
      - run: uv run python analysis/analyze.py results/smoke
