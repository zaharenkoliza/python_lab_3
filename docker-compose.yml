name: asyncbench
services:
  db:
    build: ./db
    image: asyncbench-db:1
    environment: {POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench}
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB", "-c", "fsync=off"]
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      retries: 30
  app:
    build: ./app
    image: asyncbench-app:1
    container_name: sut
    environment:
      DRIVER: ${DRIVER:-async_asyncpg}
      POOL_SIZE: ${POOL_SIZE:-20}
    cpus: 1          # SUT ограничен 1 ядром: узкое место - всегда SUT, а не генератор
    mem_limit: 512m
    depends_on: {db: {condition: service_healthy}}
  loadgen:
    build: ./loadgen
    image: asyncbench-loadgen:1
    profiles: ["tools"]
    cpus: 3
    mem_limit: 512m
    volumes: ["./results:/results"]
